const cleanStr = (str) => str ? str.normalize('NFC').toLowerCase().replace(/[.,!?;:"“”‘’…\-–—()]/g, " ").replace(/\s+/g, " ").trim() : "";

// Phần 3: AI đọc cả dấu câu (chấm, phẩy, chấm hỏi, chấm than, mở/đóng ngoặc kép, ba chấm, hai chấm)
const spellPunct = (text) => text.replace(/\.{3,}|…|[.,?!:“”"]/g, (m, off, str) => {
    if (m === '.') return ', chấm, ';
    if (m === ',') return ', phẩy, ';
    if (m === '?') return ', chấm hỏi, ';
    if (m === '!') return ', chấm than, ';
    if (m === ':') return ', hai chấm, ';
    if (m === '…' || m.length >= 3) return ', ba chấm, ';
    const prev = off === 0 ? ' ' : str[off - 1];
    return /[\s:(]/.test(prev) ? ', mở ngoặc kép, ' : ', đóng ngoặc kép, ';
});
// Phần 3: so sánh CÓ dấu câu. Chấp nhận " thẳng thay cho “ ”, và ... thay cho …; không phân biệt hoa/thường, không quan tâm khoảng trắng cạnh dấu
const normP3 = (str) => (str || '').normalize('NFC').toLowerCase()
    .replace(/[“”‘’"']/g, '"').replace(/\.{3,}/g, '…')
    .replace(/\s+/g, ' ')
    .replace(/\s*([.,?!:;…])/g, '$1').replace(/([.,?!:;…])(?=\S)/g, '$1 ')
    .replace(/\s*"\s*/g, '"').replace(/\s+/g, ' ').trim();

            if (!spokenClean) return 0; if (spokenClean === mainWordClean || spokenClean === spellClean) return 100;
            const spokenWords = spokenClean.split(/\s+/).filter(Boolean); const spellWords = spellClean.split(/\s+/).filter(Boolean);
            const lastSpokenWord = spokenWords[spokenWords.length - 1] || "";
            const hasMainWord = spokenWords.includes(mainWordClean) || lastSpokenWord === mainWordClean;
            if (!hasMainWord) return Math.min(60, Math.round((spokenClean.includes(mainWordClean[0]) ? 40 : 20)));
            if (spokenWords.length === 1 && spokenWords[0] === mainWordClean) return 100;
            let spellMatched = 0; spellWords.forEach(w => { if (spokenWords.includes(w)) spellMatched++; });
            const spellRatio = spellWords.length > 0 ? (spellMatched / spellWords.length) : 1;
            if (spellRatio >= 0.8) return 100; else return Math.round(85 + (spellRatio / 0.8) * 10);
        };

        // ---- Đánh vần tự động (cụm 1-15 và 16-30) ----
        const SP_INIT = [['ngh','ngờ'],['ng','ngờ'],['nh','nhờ'],['ph','phờ'],['th','thờ'],['tr','trờ'],['ch','chờ'],['kh','khờ'],['gh','gờ'],['gi','di'],['qu','quờ'],
            ['b','bờ'],['c','cờ'],['d','dờ'],['đ','đờ'],['g','gờ'],['h','hờ'],['k','ka'],['l','lờ'],['m','mờ'],['n','nờ'],['r','rờ'],['s','sờ'],['t','tờ'],['v','vờ'],['x','xờ']];
        const SP_TONES = { '\u0300': 'huyền', '\u0301': 'sắc', '\u0309': 'hỏi', '\u0303': 'ngã', '\u0323': 'nặng' };
        const VOWEL_START = /^[aăâeêioôơuưyáàảãạ]/;
        const spellSyl = (syl) => {
            const s = syl.toLowerCase(); let tone = '', stripped = '';
            for (const ch of s.normalize('NFD')) { if (SP_TONES[ch]) tone = SP_TONES[ch]; else stripped += ch; }
            const base = stripped.normalize('NFC');
            let name = '', vowel = base;
            for (const [k, n] of SP_INIT) {
                if (base.startsWith(k) && base.length > k.length && VOWEL_START.test(base.slice(k.length))) { name = n; vowel = base.slice(k.length); break; }
            }
            if (!name && base === 'gi') { name = 'gờ'; vowel = 'i'; }
            if (name) return `${name} ${vowel} ${base}` + (tone ? ` ${tone} ${s}` : '');
            return tone ? `${vowel} ${tone} ${s}` : vowel;
        };
        const spellWord = (w) => w.trim().split(/\s+/).map(spellSyl).join(', ') + ', ' + w.trim();

        const CDB = CLUSTER_DATA[CLUSTER];
        const allWords = CDB.words.map(w => ({ word: w, spell: spellWord(w) }));

        const rawPart1Database = allWords;         // Phần 1: đánh vần

        const rawPart3Database = [...allSentences]; // Phần 3: nghe & nhập câu

            return result.slice(0, targetCount);

        const calculateWordScore = (spoken, wordObj) => {
            const spokenClean = cleanStr(spoken); const mainWordClean = cleanStr(wordObj.word); const spellClean = cleanStr(wordObj.spell);
            if (!spokenClean) return 0; if (spokenClean === mainWordClean || spokenClean === spellClean) return 100;
            const spokenWords = spokenClean.split(/\s+/).filter(Boolean); const spellWords = spellClean.split(/\s+/).filter(Boolean);
            const lastSpokenWord = spokenWords[spokenWords.length - 1] || "";
            const hasMainWord = spokenWords.includes(mainWordClean) || lastSpokenWord === mainWordClean;
            if (!hasMainWord) return Math.min(60, Math.round((spokenClean.includes(mainWordClean[0]) ? 40 : 20)));
            if (spokenWords.length === 1 && spokenWords[0] === mainWordClean) return 100;
            let spellMatched = 0; spellWords.forEach(w => { if (spokenWords.includes(w)) spellMatched++; });
            const spellRatio = spellWords.length > 0 ? (spellMatched / spellWords.length) : 1;
            if (spellRatio >= 0.8) return 100; else return Math.round(85 + (spellRatio / 0.8) * 10);

            let matched = 0; let targetIdx = 0;
            spokenWords.forEach(word => {

            });
            const percent = Math.round((matched / targetWords.length) * 100);

                                    <div className="space-y-6">
                                        <div className="flex justify-between items-center border-b pb-3">
                                            <h2 className="text-2xl font-black text-slate-800">⚙️ Cấu Hình</h2>
                                            <div className="flex gap-2">
                                                <button onClick={handleResetDefault} className="text-xs bg-amber-100 hover:bg-amber-200 text-amber-700 font-bold px-3 py-1.5 rounded-lg border border-amber-300">🔄 Khôi phục</button>
                                                <button onClick={() => setIsAdminAuth(false)} className="text-xs bg-red-100 hover:bg-red-200 text-red-600 font-bold px-3 py-1.5 rounded-lg border border-red-300">🔒 Khóa lại</button>
                                            </div>
                                        </div>
                                        
                                        {/* Cấu hình Số lượng câu hỏi */}
                                        <div className="bg-emerald-50 p-4 rounded-2xl border-2 border-emerald-200 space-y-4">
                                            <h3 className="font-black text-emerald-800">📊 Số lượng câu hỏi (1-300):</h3>
                                            <div className="flex justify-between"><span className="font-bold text-sm">Phần 1:</span><input type="number" min="1" max="300" value={data.p1Count} onChange={(e) => handleUpdateCounts(Number(e.target.value), data.p2Count, data.p3Count)} className="w-24 p-1 border-2 rounded text-center" /></div>
                                            <div className="flex justify-between"><span className="font-bold text-sm">Phần 2:</span><input type="number" min="1" max="300" value={data.p2Count} onChange={(e) => handleUpdateCounts(data.p1Count, Number(e.target.value), data.p3Count)} className="w-24 p-1 border-2 rounded text-center" /></div>
                                            <div className="flex justify-between"><span className="font-bold text-sm">Phần 3:</span><input type="number" min="1" max="300" value={data.p3Count} onChange={(e) => handleUpdateCounts(data.p1Count, data.p2Count, Number(e.target.value))} className="w-24 p-1 border-2 rounded text-center" /></div>
                                        </div>

                                        {/* Cấu hình Ngưỡng điểm */}
                                        <div className="bg-sky-50 p-4 rounded-2xl border-2 border-sky-200 space-y-4 mt-4">
                                            <h3 className="font-black text-sky-800">🎯 Cài đặt mức độ đọc đúng (%):</h3>
                                            <div className="flex justify-between items-center">
                                                <span className="font-bold text-sm text-slate-700">Mức Đạt (Pass):</span>
                                                <input type="number" min="10" max="100" value={passThreshold} onChange={(e) => setPassThreshold(Number(e.target.value))} className="w-24 p-1 border-2 rounded text-center" />
                                            </div>
                                            <div className="flex justify-between items-center">
                                                <span className="font-bold text-sm text-slate-700">Mức Hoàn hảo (Perfect):</span>
                                                <input type="number" min="10" max="100" value={perfectThreshold} onChange={(e) => setPerfectThreshold(Number(e.target.value))} className="w-24 p-1 border-2 rounded text-center" />
                                            </div>
                                            <p className="text-xs text-slate-500 italic">Hệ thống sẽ dựa vào mức Đạt để cho qua câu, và mức Hoàn hảo để dành lời khen đặc biệt cho học sinh.</p>
                                        </div>
                                    </div>
                                )}
                            </div>
                        )}
                    </main>

                    {/* Modals Popup */}
                    {showMilestone && (
                        <div className="fixed inset-0 bg-black/60 z-[100] flex items-center justify-center p-4">
                            <div className="bg-white rounded-3xl p-8 text-center animate-bounce shadow-2xl border-4 border-yellow-400">
                                <div className="text-8xl mb-4">🌟</div>
                                <h2 className="text-4xl font-black text-red-500 mb-4">CHÚC MỪNG BÉ!</h2>
                                <p className="text-2xl font-bold text-emerald-600">Bé đã xuất sắc hoàn thành thêm 10 câu!</p>
                                <button onClick={() => setShowMilestone(false)} className="mt-6 bg-yellow-500 hover:bg-yellow-400 text-white font-black py-3 px-8 rounded-full btn-3d text-xl border-yellow-700">Tiếp tục nào!</button>
                            </div>
                        </div>
                    )}

                    {reviewModal.open && (
                        <div className="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4">
                            <div className="bg-white rounded-3xl max-w-4xl w-full max-h-[85vh] p-6 overflow-y-auto shadow-2xl border-4 border-emerald-300">
                                <div className="flex justify-between items-center border-b pb-3 mb-4 sticky top-0 bg-white z-10">
                                    <h3 className="text-2xl font-black text-slate-800 flex items-center gap-2">
                                        <span>📚</span> Bảng Ôn Tập Toàn Bộ
                                        <span className="text-sm font-bold text-emerald-600 bg-emerald-100 px-2 py-1 rounded-lg">({reviewModal.part === 'p1' ? rawPart1Database.length : reviewModal.part === 'p2' ? rawPart2Database.length : rawPart3Database.length} câu)</span>
                                    </h3>
                                    <button onClick={() => setReviewModal({ open: false, part: null })} className="text-gray-500 hover:text-red-500 font-black text-3xl leading-none">✖</button>
                                </div>
                                
                                <div className={`grid gap-3 ${reviewModal.part === 'p1' ? 'grid-cols-2 sm:grid-cols-3 md:grid-cols-4' : 'grid-cols-1 sm:grid-cols-2'}`}>
                                    {reviewModal.part === 'p1' && rawPart1Database.map((item, idx) => (
                                        <div key={idx} className={`p-3 rounded-xl border-2 flex flex-col justify-center items-center text-center gap-2 ${completedHistory.p1.includes(cleanStr(item.word)) ? 'bg-green-50 border-green-300' : 'bg-sky-50 border-sky-200'}`}>
                                            <p className={`font-black text-lg ${completedHistory.p1.includes(cleanStr(item.word)) ? 'text-green-700' : 'text-sky-800'}`}>{item.word} {completedHistory.p1.includes(cleanStr(item.word)) && <span className="text-sm">✅</span>}</p>
                                            <button onClick={() => speakText(item.spell)} className={`w-full ${completedHistory.p1.includes(cleanStr(item.word)) ? 'bg-green-500' : 'bg-sky-500'} text-white text-xs px-2 py-1.5 rounded-lg font-bold`}>🔊 Nghe</button>
                                        </div>
                                    ))}
                                    {reviewModal.part === 'p2' && rawPart2Database.map((item, idx) => (
                                        <div key={idx} className={`p-3 rounded-xl border-2 flex justify-between items-center ${completedHistory.p2.includes(item) ? 'bg-green-50 border-green-300' : 'bg-emerald-50 border-emerald-200'}`}>
                                            <p className={`font-black text-base flex items-center gap-2 ${completedHistory.p2.includes(item) ? 'text-green-700' : 'text-emerald-800'}`}>{item} {completedHistory.p2.includes(item) && <span className="text-sm">✅</span>}</p>
                                            <button onClick={() => speakText(item)} className={`${completedHistory.p2.includes(item) ? 'bg-green-500' : 'bg-emerald-500'} text-white text-xs px-3 py-1.5 rounded-lg font-bold shrink-0 ml-2`}>🔊 Nghe</button>
                                        </div>
                                    ))}
                                    {reviewModal.part === 'p3' && rawPart3Database.map((item, idx) => (
                                        <div key={idx} className={`p-3 rounded-xl border-2 flex justify-between items-center ${completedHistory.p3.includes(item) ? 'bg-green-50 border-green-300' : 'bg-purple-50 border-purple-200'}`}>
                                            <p className={`font-black text-base flex items-center gap-2 ${completedHistory.p3.includes(item) ? 'text-green-700' : 'text-purple-800'}`}>{item} {completedHistory.p3.includes(item) && <span className="text-sm">✅</span>}</p>
                                            <button onClick={() => speakText(spellPunct(item), 0.6)} className={`${completedHistory.p3.includes(item) ? 'bg-green-500' : 'bg-purple-500'} text-white text-xs px-3 py-1.5 rounded-lg font-bold shrink-0 ml-2`}>🔊 Nghe</button>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };
        return App;
        })();

        const BASIC_CLUSTERS = ['1-15', '16-30'];
        const Root = () => (BASIC_CLUSTERS.includes(CLUSTER) ? <BasicApp /> : <App />);
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<Root />);
    </script>
</body>
</html>
